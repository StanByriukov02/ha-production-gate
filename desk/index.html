<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Production Gate · Dual desk</title>
  <style>
    :root {
      --bg0: #0c0f12;
      --bg1: #141a20;
      --ink: #e8eef4;
      --muted: #8b9aab;
      --line: rgba(232, 238, 244, 0.12);
      --safe: #3ecf8e;
      --hostile: #ff6b4a;
      --accent: #c4a574;
      --mono: "IBM Plex Mono", "Cascadia Code", ui-monospace, monospace;
      --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(196, 165, 116, 0.12), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(62, 207, 142, 0.08), transparent 50%),
        linear-gradient(165deg, var(--bg0), var(--bg1) 55%, #0a0d10);
    }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    .brand {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }
    h1 {
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1.1;
      max-width: 16ch;
      margin-bottom: 12px;
    }
    .lede {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
      max-width: 42ch;
      margin-bottom: 36px;
    }
    .panel {
      border-top: 1px solid var(--line);
      padding-top: 28px;
      display: grid;
      gap: 20px;
    }
    label {
      display: block;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    select, input[type="file"] {
      width: 100%;
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 12px 14px;
      font: 14px/1.3 var(--sans);
      border-radius: 2px;
    }
    select:focus { outline: 1px solid var(--accent); }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 720px) { .row { grid-template-columns: 1fr; } }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 8px;
    }
    button {
      appearance: none;
      border: 0;
      background: var(--ink);
      color: #0c0f12;
      font: 600 14px/1 var(--sans);
      padding: 14px 22px;
      border-radius: 2px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: wait; }
    button.ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .hint { font-size: 13px; color: var(--muted); }
    .results {
      margin-top: 12px;
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .results.show { display: grid; }
    @media (max-width: 720px) { .results { grid-template-columns: 1fr; } }
    .lane {
      border: 1px solid var(--line);
      padding: 18px 18px 16px;
      background: rgba(0,0,0,0.28);
    }
    .lane.safe { border-color: rgba(62, 207, 142, 0.35); }
    .lane.hostile { border-color: rgba(255, 107, 74, 0.4); }
    .lane h2 {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .lane.safe h2 { color: var(--safe); }
    .lane.hostile h2 { color: var(--hostile); }
    .metric {
      font-size: 34px;
      font-weight: 650;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }
    .sub { margin-top: 8px; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .verdict {
      margin-top: 18px;
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.06em;
      display: none;
    }
    .verdict.show { display: block; }
    .foot {
      margin-top: 40px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .foot a { color: var(--accent); }
    .err {
      display: none;
      margin-top: 14px;
      color: var(--hostile);
      font-size: 14px;
      white-space: pre-wrap;
    }
    .err.show { display: block; }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="brand">Production Gate</p>
    <h1>Dual desk</h1>
    <p class="lede">
      Same body, two soils. Safe must allow. Hostile must refuse.
      Open a ROS-shaped body — or drop your URDF.
    </p>

    <section class="panel">
      <div class="row">
        <div>
          <label for="preset">Open body</label>
          <select id="preset"></select>
        </div>
        <div>
          <label for="urdf">Or your URDF</label>
          <input id="urdf" type="file" accept=".urdf,text/xml" />
        </div>
      </div>
      <div class="actions">
        <button id="run" type="button">Run Dual</button>
        <button id="clear" class="ghost" type="button">Clear file</button>
        <span class="hint" id="status">Local only · soft teaching · not MEASURED</span>
      </div>
      <p class="err" id="err"></p>
      <div class="results" id="results">
        <div class="lane safe">
          <h2>Safe</h2>
          <div class="metric" id="safe-mm">—</div>
          <p class="sub" id="safe-sub"></p>
        </div>
        <div class="lane hostile">
          <h2>Hostile</h2>
          <div class="metric" id="hostile-mm">—</div>
          <p class="sub" id="hostile-sub"></p>
        </div>
      </div>
      <p class="verdict" id="verdict"></p>
    </section>

    <p class="foot">
      CLI twin: <code>ha-dual-socket --preset open_diffbot</code>
      · ritual CI still uses <code>ha-production-gate</code>
      · <a href="https://github.com/StanByriukov02/ha-production-gate">repo</a>
    </p>
  </main>
  <script>
    const presetEl = document.getElementById("preset");
    const urdfEl = document.getElementById("urdf");
    const runEl = document.getElementById("run");
    const clearEl = document.getElementById("clear");
    const statusEl = document.getElementById("status");
    const errEl = document.getElementById("err");
    const resultsEl = document.getElementById("results");
    const verdictEl = document.getElementById("verdict");

    async function loadPresets() {
      const r = await fetch("/api/presets");
      const j = await r.json();
      presetEl.innerHTML = "";
      for (const p of j.presets || []) {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = p.label || p.id;
        if (p.id === "open_diffbot") opt.selected = true;
        presetEl.appendChild(opt);
      }
    }

    function showErr(msg) {
      errEl.textContent = msg || "";
      errEl.classList.toggle("show", Boolean(msg));
    }

    function fmtLane(elMm, elSub, lane) {
      const mm = lane && lane.sinkage_mm;
      elMm.textContent = mm == null ? "—" : Number(mm).toFixed(3) + " mm";
      elSub.textContent = [
        "soil " + (lane.soil_id || "—"),
        "pass=" + lane.physics_pass,
        "allowed=" + lane.current_allowed,
      ].join(" · ");
    }

    clearEl.addEventListener("click", () => {
      urdfEl.value = "";
      statusEl.textContent = "Using open body preset";
    });

    runEl.addEventListener("click", async () => {
      showErr("");
      runEl.disabled = true;
      statusEl.textContent = "Running Dual…";
      try {
        let body = { preset: presetEl.value };
        const file = urdfEl.files && urdfEl.files[0];
        if (file) {
          const text = await file.text();
          body = {
            urdf_name: file.name,
            urdf_text: text,
            kind: "wheeled_base",
          };
        }
        const r = await fetch("/api/dual", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const j = await r.json();
        if (!r.ok || j.error) throw new Error(j.error || ("HTTP " + r.status));
        resultsEl.classList.add("show");
        fmtLane(
          document.getElementById("safe-mm"),
          document.getElementById("safe-sub"),
          j.safe || {}
        );
        fmtLane(
          document.getElementById("hostile-mm"),
          document.getElementById("hostile-sub"),
          j.hostile || {}
        );
        verdictEl.textContent = j.verdict || "";
        verdictEl.classList.add("show");
        statusEl.textContent = j.ok ? "Dual PASS" : "Dual FAIL — read Hostile lane";
      } catch (e) {
        showErr(String(e.message || e));
        statusEl.textContent = "Failed";
      } finally {
        runEl.disabled = false;
      }
    });

    loadPresets().catch((e) => showErr(String(e)));
  </script>
</body>
</html>
