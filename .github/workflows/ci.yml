name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install package
        run: pip install -e ".[smoke]"

      - name: Build gate bins
        run: |
          cargo build -p ha_physics_gate --release
          cargo build -p ha_silicon_fuse --release
          cargo build -p ha_energy_ledger --release
          cargo build -p ha_body_identity --release
          cargo build -p universe_kinematic --release --bin manipulator_kinematics_step

      - name: Run Production Gate
        env:
          PYTHONIOENCODING: utf-8
        run: ha-production-gate
