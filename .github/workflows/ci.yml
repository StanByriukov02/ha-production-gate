name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install package
        run: pip install -e ".[smoke]"

      - name: Build gate bins
        run: |
          cargo build -p ha_physics_gate --release
          cargo build -p ha_silicon_fuse --release
          cargo build -p ha_energy_ledger --release
          cargo build -p ha_body_identity --release
          cargo build -p universe_kinematic --release --bin manipulator_kinematics_step

      - name: Dual socket (robotics wow)
        env:
          PYTHONIOENCODING: utf-8
        run: ha-dual-socket --preset open_diffbot

      - name: Dual socket owned soils
        env:
          PYTHONIOENCODING: utf-8
        run: |
          ha-dual-socket --preset open_diffbot \
            --soils fixtures/open_registry/terramech/dual_owned_soils_embedded_v1.json

      - name: Dual socket stranger URDF + owned soils
        env:
          PYTHONIOENCODING: utf-8
        run: |
          ha-dual-socket \
            --urdf fixtures/open_registry/urdf/ros_skidsteer_v1.urdf \
            --kind wheeled_base \
            --soils fixtures/open_registry/terramech/dual_owned_soils_skidsteer_v1.json

      - name: Dual socket third-party Fetch URDF (expect FAIL — truth)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          ha-dual-socket \
            --urdf fixtures/open_registry/urdf/_external/fetch.urdf \
            --root-link base_link \
            --ee-link gripper_link \
            --kind wheeled_base \
            --soils fixtures/open_registry/terramech/dual_owned_soils_fetch_v1.json
          code=$?
          set -e
          test "$code" -eq 1
          python -c "import json; from pathlib import Path; d=json.loads(Path('results/runtime/platform_loop/DUAL_SOCKET_LATEST_v1.json').read_text()); assert d['verdict']=='DUAL_SOCKET_FAIL'; assert d['safe']['physics_pass'] is False"

      - name: Thin ros2 Dual bridge (T5)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          ha-dual-ros2 \
            --urdf fixtures/open_registry/urdf/ros_skidsteer_v1.urdf \
            --kind wheeled_base \
            --soils fixtures/open_registry/terramech/dual_owned_soils_skidsteer_v1.json
          ha-dual-ros2 \
            --robot-description-file fixtures/open_registry/urdf/ros_skidsteer_v1.urdf \
            --kind wheeled_base \
            --soils fixtures/open_registry/terramech/dual_owned_soils_skidsteer_v1.json
          test -f results/runtime/platform_loop/HA_DUAL_ROS2_LATEST_v1.json
          test -f ros2/ha_dual_ros2/package.xml

      - name: Production Gate ritual (CI falsifiers)
        env:
          PYTHONIOENCODING: utf-8
        run: ha-production-gate

      - name: Smoke tests
        run: pytest -q
