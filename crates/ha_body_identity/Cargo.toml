[package]
name = "ha_body_identity"
version = "0.1.0"
edition = "2021"
description = "H-body (Chip x Body Identity) non-Python core"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ha-body-identity"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
