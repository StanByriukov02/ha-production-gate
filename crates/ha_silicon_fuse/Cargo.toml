[package]
name = "ha_silicon_fuse"
version = "0.1.0"
edition = "2021"
description = "H6-iron silicon fuse / secure-element apoptosis — C core + Rust CLI"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ha-silicon-fuse"
path = "src/main.rs"

[dependencies]
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[build-dependencies]
cc = "1"
