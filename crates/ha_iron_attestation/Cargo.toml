[package]
name = "ha_iron_attestation"
version = "0.1.0"
edition = "2021"
description = "H10 BYO iron socket — attestation validate + soft stub (not OTP)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ha-iron-attestation"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ha_silicon_fuse = { path = "../ha_silicon_fuse" }
